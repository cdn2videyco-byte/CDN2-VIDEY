<script>
const JSON_URL = "videos.json";
const DIRECT_LINK = "https://omg10.com/4/10430784";

const video = document.getElementById("player");
const title = document.getElementById("title");

let redirected = false;

fetch(JSON_URL)
.then(res => res.json())
.then(data => {
  const vids = data.videos;
  const params = new URLSearchParams(window.location.search);
  const id = params.get("id");

  let selected = vids.find(v => v.id === id);

  if (!selected) {
    selected = vids[Math.floor(Math.random() * vids.length)];
  }

  video.src = selected.cdn;
  title.innerText = selected.id;
});

video.addEventListener("timeupdate", () => {
  if (!redirected && video.currentTime >= 30) {
    redirected = true;
    window.location.href = DIRECT_LINK;
  }
});
</script>
